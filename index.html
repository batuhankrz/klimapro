<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6bcb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KlimaPro – Saha &amp; Finans Yönetimi</title>
<style>
:root{
  --bg:#f3f5f8;--card:#fff;--tx:#14202e;--mut:#64748b;--bd:#dbe2ea;--pri:#0b6bcb;--pri-tx:#fff;
  --ok:#0f7a55;--warn:#a85f00;--bad:#c62828;--soft:#e8f1fc;--okbg:#e3f5ed;--warnbg:#fff1d9;--badbg:#fde8e8;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1520;--card:#172130;--tx:#e8eef5;--mut:#93a4b8;--bd:#2a3849;--pri:#4a9cf0;--pri-tx:#06121f;
  --ok:#4cc79a;--warn:#f0b04a;--bad:#ff8a80;--soft:#1a2b40;--okbg:#12342a;--warnbg:#3a2d12;--badbg:#3d1c1c;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0e1520;--card:#172130;--tx:#e8eef5;--mut:#93a4b8;--bd:#2a3849;--pri:#4a9cf0;--pri-tx:#06121f;
  --ok:#4cc79a;--warn:#f0b04a;--bad:#ff8a80;--soft:#1a2b40;--okbg:#12342a;--warnbg:#3a2d12;--badbg:#3d1c1c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:block}
.col{min-width:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
.brand{font-weight:700;font-size:17px}
#status{font-size:12px;color:var(--mut);text-align:right;line-height:1.25}
#status b{color:var(--ok)}
#status .w{color:var(--warn)}
#status .e{color:var(--bad)}
main{padding:14px 14px 96px;max-width:1100px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs a{flex:1;text-align:center;padding:7px 2px 6px;font-size:11px;color:var(--mut);text-decoration:none;cursor:pointer}
nav.tabs a span{display:block;font-size:20px;line-height:1.2}
nav.tabs a.on{color:var(--pri);font-weight:600}
nav.side{display:none}
@media(min-width:900px){
  #app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  nav.tabs{display:none}
  nav.side{display:flex;flex-direction:column;gap:2px;padding:14px 10px;background:var(--card);border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;overflow:auto}
  nav.side a{padding:10px 12px;border-radius:10px;color:var(--tx);text-decoration:none;cursor:pointer}
  nav.side a.on{background:var(--soft);color:var(--pri);font-weight:600}
  nav.side .logo{font-weight:800;font-size:18px;padding:6px 12px 14px}
  main{padding-bottom:40px}
}
h2{margin:4px 0 12px;font-size:20px}
h3{margin:18px 0 8px;font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.stat small{color:var(--mut);display:block;font-size:12px}
.stat b{font-size:19px;display:block;margin-top:2px}
.stat em{font-style:normal;font-size:12px;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}
.sm{font-size:13px}
.btn{border:1px solid var(--bd);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-block;color:var(--tx)}
.btn.pri{background:var(--pri);color:var(--pri-tx);border-color:var(--pri)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn:active{opacity:.8}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{border:1px solid var(--bd);background:var(--card);padding:6px 12px;border-radius:99px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--pri);color:var(--pri-tx);border-color:var(--pri)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--pri)}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.bad{background:var(--badbg);color:var(--bad)}
.it{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.it[data-act],.it[data-go]{cursor:pointer}
.it-m{min-width:0;flex:1}
.it-m b{display:block;overflow:hidden;text-overflow:ellipsis}
.it-m small{display:block;color:var(--mut)}
.it-r{text-align:right;white-space:nowrap}
.it-r b{display:block}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);min-height:42px}
input[type=checkbox]{width:auto;min-height:0}
textarea{resize:vertical}
.fl{display:block;margin-bottom:10px}
.fl>span{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.fl small{color:var(--mut);font-size:12px}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0;cursor:pointer}
.chk.sm{font-size:13px;white-space:nowrap}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-bottom:8px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;position:sticky;bottom:-1px;background:var(--card);padding:8px 0}
.btns .btn{flex:1}
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,10,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:94vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:760px){.ov{align-items:center}.sheet{border-radius:18px;max-height:90vh}}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd)}
.sh-h .x{border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;cursor:pointer}
.sh-b{padding:14px 16px;overflow:auto;-webkit-overflow-scrolling:touch}
.ln{border:1px solid var(--bd);border-radius:12px;padding:8px;margin-bottom:8px;background:var(--bg)}
.ln input,.ln select{margin-bottom:6px;background:var(--card)}
.ln2{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ln2 input,.ln2 select{flex:1;min-width:80px;margin:0}
.ln2 input[type=checkbox]{flex:none;min-width:0}
.ln2 .chk{margin:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px}
td.r,th.r{text-align:right}
.tw{overflow-x:auto}
canvas.sig{width:100%;height:160px;background:#fff;border:1px dashed var(--mut);border-radius:12px;touch-action:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#14202e;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:90%;font-size:14px}
.banner{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lock .card{max-width:320px;width:100%;text-align:center}
.qr{display:flex;justify-content:center;padding:10px}
.qr img{max-width:100%}
pre.small{white-space:pre-wrap;font-size:12px;background:var(--bg);padding:8px;border-radius:8px}
</style>
</head>
<body>
<div id="app">
  <nav class="side" id="side"></nav>
  <div class="col">
    <header><div class="brand">❄️ KlimaPro</div><div id="status"></div></header>
    <main id="main"></main>
  </div>
</div>
<nav class="tabs" id="tabs"></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
'use strict';
/* =====================================================================
   KlimaPro – HVAC Saha Yönetimi, Keşif ve Finans (tek dosya)
   Veri: cihazda (IndexedDB + localStorage) ve varsa bulutta (artifact db) saklanır.
   ===================================================================== */
const COLS=['parties','products','warehouses','stock','devices','surveys','jobs','forms','invoices','payments','expenses','closings','staff','reminders','settings','debtlines','measurements'];
const S={};COLS.forEach(c=>S[c]={});
const IDB='klimapro',LSKEY='klimapro_state_v1';

/* ---------- yardımcılar ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const dstr=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addMonths=(s,m)=>{const d=new Date(s+'T00:00:00');d.setMonth(d.getMonth()+m);return dstr(d)};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return dstr(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const dtr=s=>s?new Date(String(s).length<=10?s+'T00:00:00':s).toLocaleDateString('tr-TR'):'-';
const ttr=ts=>ts?new Date(ts).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'-';
const num=v=>{v=parseFloat(v);return isFinite(v)?v:0};
const r2=n=>Math.round((+n||0)*100)/100;
const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(n||0);
const qf=n=>new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2}).format(n||0);
const byName=(a,b)=>String(a.name||a.title||'').localeCompare(String(b.name||b.title||''),'tr');
const list=c=>Object.values(S[c]).filter(x=>!x.deleted);
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const P=id=>S.parties[id];
const partyName=id=>P(id)&&!P(id).deleted?P(id).title:'—';
const staffName=id=>S.staff[id]&&!S.staff[id].deleted?S.staff[id].name:'—';

/* ---------- ayarlar ---------- */
const DEFAULTS={company:'',phone:'',address:'',taxNo:'',warrantyMonths:24,maintMonths:12,vatRates:'0,1,10,20',vatDefault:20,gasPerM:15,fire:10,
  perJob:0,extraRate:0,reworkPenalty:0,openingCash:0,expenseCats:'Akaryakıt,Personel avansı,Yedek parça,Dükkan masrafı,Yemek,Diğer',
  remTemplate:'Sayın {ad}, {cihaz} cihazınızın {tur} zamanı geldi. Randevu için bize ulaşabilirsiniz. {firma}',theme:'auto',pin:'',lastBackup:0,currentStaffId:''};
const cfg=()=>({...DEFAULTS,...(S.settings.main||{})});
const setCfg=p=>put('settings',{...(S.settings.main||{}),...p,id:'main'});
const vatRates=()=>cfg().vatRates.split(',').map(x=>+x.trim()).filter(x=>!isNaN(x)&&x>=0);
const expCats=()=>cfg().expenseCats.split(',').map(x=>x.trim()).filter(Boolean);

/* ---------- kalıcı kayıt: cihaz ---------- */
let dirty=false,localOK=null,saveTimer=null;
function idbOpen(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('noidb'));const r=indexedDB.open(IDB,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(){const db=await idbOpen();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(v){const db=await idbOpen();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,'state');t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function loadLocal(){
  let raw=null;
  try{raw=await idbGet()}catch(e){}
  if(!raw){try{raw=localStorage.getItem(LSKEY)}catch(e){}}
  if(raw){try{const o=JSON.parse(raw);COLS.forEach(c=>{S[c]=o[c]||{}})}catch(e){}}
}
function scheduleSave(){dirty=true;renderStatus();clearTimeout(saveTimer);saveTimer=setTimeout(flush,200)}
async function flush(){
  clearTimeout(saveTimer);
  const json=JSON.stringify(S);let ok=false;
  try{await idbSet(json);ok=true}catch(e){}
  try{if(json.length<4e6){localStorage.setItem(LSKEY,json);ok=true}}catch(e){}
  localOK=ok;dirty=false;renderStatus();
}

/* ---------- kalıcı kayıt: bulut (artifact db) ---------- */
let rdb=null,cloud='off';const synced={},pend=new Map(),queue=[];let pumping=false;
async function initCloud(){
  try{if(!window.claude||!claude.use)return;cloud='wait';renderStatus();rdb=await claude.use('db')}catch(e){rdb=null}
  if(!rdb){cloud='off';renderStatus();return}
  COLS.forEach(col=>{
    try{rdb.collection(col).onSnapshot(snap=>onRemote(col,snap),err=>{cloud=(err&&err.code==='revoked')?'ro':'err';renderStatus()})}catch(e){cloud='err'}
  });
}
function onRemote(col,snap){
  let changed=false;const rem={};
  snap.docs.forEach(d=>{rem[d.id]=d.data()});
  Object.keys(rem).forEach(id=>{
    if(pend.get(col+'/'+id))return;
    const r=rem[id],l=S[col][id];
    if(!l||(r.updated||0)>(l.updated||0)){S[col][id]={...r,id};changed=true}
  });
  if(!snap.metadata.fromCache&&!synced[col]){
    synced[col]=true;
    Object.values(S[col]).forEach(l=>{const r=rem[l.id];if(!r||(l.updated||0)>(r.updated||0))pushRemote(col,l.id)});
  }
  if(cloud!=='ro'&&cloud!=='err')cloud='ok';
  if(changed){scheduleSave();soft()}
  renderStatus();
}
function pushRemote(col,id){
  if(!rdb||cloud==='ro')return;
  const k=col+'/'+id;pend.set(k,(pend.get(k)||0)+1);queue.push([col,id]);pump();
}
async function pump(){
  if(pumping)return;pumping=true;
  while(queue.length){
    const [col,id]=queue.shift();const k=col+'/'+id;const o=S[col][id];
    if(o){
      try{await rdb.doc(k).set(JSON.parse(JSON.stringify(o)));if(cloud!=='ro')cloud='ok'}
      catch(e){
        const c=e&&e.code;
        if(c==='invalid_argument'||c==='revoked'||c==='not_granted'){cloud='ro'}
        else{cloud='err';setTimeout(()=>pushRemote(col,id),6000)}
      }
    }
    pend.set(k,Math.max(0,(pend.get(k)||1)-1));renderStatus();
  }
  pumping=false;
}
let softT=null;
function soft(){clearTimeout(softT);softT=setTimeout(()=>{if(modalStack.length)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;render()},250)}

/* ---------- veri işlemleri ---------- */
function put(col,o){o.id=o.id||uid();o.updated=Date.now();S[col][o.id]=o;scheduleSave();pushRemote(col,o.id);return o}
function remove(col,id){const o=S[col][id];if(o){put(col,{...o,deleted:true})}}
function renderStatus(){
  const el=$('#status');if(!el)return;
  const dev=localOK===false?'<span class="e">⚠ Cihaza yazılamadı</span>':dirty?'<span class="w">Kaydediliyor…</span>':'<b>✓ Kaydedildi</b>';
  const pending=[...pend.values()].some(v=>v>0);
  const cl={off:'Yerel',wait:'Bulut…',ok:pending?'Bulut eşitleniyor…':'Bulut ✓',err:'<span class="w">Bulut hatası</span>',ro:'<span class="w">Bulut yazma yok</span>'}[cloud];
  el.innerHTML=dev+'<br>'+cl;
}

/* ---------- arayüz altyapısı ---------- */
let modalStack=[];
function openModal(title,body){
  const el=document.createElement('div');el.className='ov';
  el.innerHTML='<div class="sheet"><div class="sh-h"><b>'+esc(title)+'</b><button class="x" type="button" aria-label="Kapat">✕</button></div><div class="sh-b"></div></div>';
  const b=$('.sh-b',el);if(typeof body==='string')b.innerHTML=body;else b.appendChild(body);
  document.body.appendChild(el);modalStack.push(el);
  el.close=()=>{el.remove();modalStack=modalStack.filter(m=>m!==el)};
  $('.x',el).onclick=()=>el.close();
  return el;
}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function ask(msg,ok='Evet'){
  return new Promise(res=>{
    const el=openModal('Onay','<p>'+esc(msg)+'</p><div class="btns"><button class="btn" type="button" data-n>Vazgeç</button><button class="btn pri" type="button" data-y>'+esc(ok)+'</button></div>');
    $('[data-n]',el).onclick=()=>{el.close();res(false)};$('[data-y]',el).onclick=()=>{el.close();res(true)};
    $('.x',el).onclick=()=>{el.close();res(false)};
  });
}
function fld(f,v){
  const val=v!==undefined?v:(f.v??'');
  if(f.t==='check')return '<label class="chk"><input type="checkbox" name="'+f.n+'" '+(val?'checked':'')+'> '+esc(f.l)+'</label>';
  let inp;
  if(f.t==='select')inp='<select name="'+f.n+'" '+(f.req?'required':'')+'>'+(f.o||[]).map(([k,l])=>'<option value="'+esc(k)+'" '+(String(k)===String(val)?'selected':'')+'>'+esc(l)+'</option>').join('')+'</select>';
  else if(f.t==='textarea')inp='<textarea name="'+f.n+'" rows="'+(f.rows||3)+'" placeholder="'+esc(f.ph||'')+'">'+esc(val)+'</textarea>';
  else inp='<input name="'+f.n+'" type="'+(f.t||'text')+'" value="'+esc(val)+'" '+(f.req?'required ':'')+(f.t==='number'?'step="any" inputmode="decimal" ':'')+(f.min!==undefined?'min="'+f.min+'" ':'')+'placeholder="'+esc(f.ph||'')+'">';
  return '<label class="fl"><span>'+esc(f.l)+(f.req?' *':'')+'</span>'+inp+(f.help?'<small>'+esc(f.help)+'</small>':'')+'</label>';
}
function formModal({title,fields,values={},submit='Kaydet',onSubmit,onDelete,after}){
  const html='<form class="frm">'+fields.map(f=>f.html||fld(f,values[f.n])).join('')+'<div class="btns">'+(onDelete?'<button type="button" class="btn danger" data-del>Sil</button>':'')+'<button class="btn pri" type="submit">'+esc(submit)+'</button></div></form>';
  const el=openModal(title,html);const form=$('form',el);
  form.onsubmit=async e=>{
    e.preventDefault();if(!form.reportValidity())return;
    const d={};fields.filter(f=>!f.html).forEach(f=>{const x=form.elements[f.n];if(!x)return;d[f.n]=f.t==='check'?x.checked:f.t==='number'?(x.value===''?'':+x.value):x.value});
    const r=await onSubmit(d,el);if(r!==false)el.close();
  };
  if(onDelete)$('[data-del]',el).onclick=async()=>{if(await ask('Bu kayıt silinsin mi?','Sil')){onDelete();el.close()}};
  if(after)after(el,form);
  return el;
}
const partyOpts=(types,empty=true)=>[...(empty?[['','— seçiniz —']]:[]),...list('parties').filter(p=>!types||types.includes(p.type)||p.type==='her_ikisi').sort(byName).map(p=>[p.id,p.title])];
const staffOpts=()=>[['','— atanmamış —'],...list('staff').sort(byName).map(s=>[s.id,s.name])];
const whOpts=()=>list('warehouses').sort(byName).map(w=>[w.id,w.name+(w.kind==='arac'?' (araç)':'')]);
const defaultWh=()=>{const st=S.staff[cfg().currentStaffId];const w=st&&list('warehouses').find(w=>w.staffId===st.id);return w?w.id:'wh_merkez'};

async function saveFile(filename,data,mime){
  try{
    if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename,data});return true}}
  }catch(e){if(e&&e.code==='declined')return false}
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:mime||'text/plain'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);return true;
  }catch(e){toast('Dosya indirilemedi');return false}
}
function waUrl(phone,text){
  let d=String(phone||'').replace(/\D/g,'');
  if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='90'+d.slice(1);else if(d.length===10)d='90'+d;
  return 'https://wa.me/'+d+'?text='+encodeURIComponent(text);
}
function getGeo(){
  return new Promise(r=>{
    if(!navigator.geolocation)return r(null);
    navigator.geolocation.getCurrentPosition(p=>r({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),()=>r(null),{enableHighAccuracy:true,timeout:8000,maximumAge:30000});
  });
}
const mapsUrl=a=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a||'');

function partyBal(p){ // >0: müşteri bize borçlu (alacak) · <0: biz borçluyuz
  let b=+p.opening||0;
  list('invoices').forEach(i=>{if(i.partyId===p.id&&i.kind==='fatura')b+=i.direction==='satis'?i.total:-i.total});
  list('payments').forEach(x=>{if(x.partyId===p.id)b-=x.direction==='tahsilat'?x.amount:-x.amount});
  return r2(b);
}
/* Mal hareketleri: yön
   - 'borc': müşteriye mal verildi (müşteri borçlu, TL değeri varsa parasal borç olarak da bakiyeye işler)
   - 'iade': müşteri iade etti (TL değeri varsa parasal borç azalır)
   Yön/TL hesapları: borç miktarı ekstra TL borcu değildir; fiyat sıfırsa yalnız miktar borçlanır.
*/
function partyDebtItems(p){ return list('debtlines').filter(x=>x.partyId===p.id); }
function partyDebtTotals(p){
  const its=partyDebtItems(p);let tl=0;const qty={};
  its.forEach(x=>{ // açık miktarlar; ödenmiş/iade kapandıysa dahil değil
    if(x.closed) return;
    qty[x.productId]=(qty[x.productId]||0)+num(x.qty)*1;
    tl += num(x.qty)*num(x.price||0);
  });
  return {tl:r2(tl),qty,items:its,open:its.filter(x=>!x.closed)};
}
function addDebtLine(partyId,productId,qty,price,note){
  const p=S.products[productId];if(!p) return null;
  const o={partyId,productId,qty:num(qty),price:r2(num(price)),unit:p.unit||'',name:p.name,note:note||'',date:dstr(),closed:false};
  put('debtlines',o);return o;
}
const invPaid=i=>sum(list('payments').filter(p=>p.invoiceId===i.id),p=>p.amount);
function stockMap(){const m={};list('stock').forEach(s=>{(m[s.productId]=m[s.productId]||{});m[s.productId][s.whId]=(m[s.productId][s.whId]||0)+s.qty});return m}
const stockTotal=(m,pid)=>sum(Object.values(m[pid]||{}));
function addStock(productId,whId,qty,reason,ref,note){put('stock',{productId,whId,qty,reason,ref:ref||'',note:note||'',date:dstr(),by:cfg().currentStaffId})}
function lowStock(){const m=stockMap();return list('products').filter(p=>p.minStock>0&&stockTotal(m,p.id)<=p.minStock)}
function calcLines(lines){
  let sub=0,vat=0;
  lines.forEach(l=>{const t=num(l.qty)*num(l.price);sub+=t;vat+=t*num(l.vat)/100});
  return {sub:r2(sub),vat:r2(vat),total:r2(sub+vat)};
}
function nextInvNo(kind){
  const y=new Date().getFullYear();const pre=kind==='teklif'?'T':'F';
  const n=list('invoices').filter(i=>i.direction==='satis'&&i.kind===kind&&String(i.date).startsWith(y)).length+1;
  return pre+'-'+y+'-'+String(n).padStart(4,'0');
}
function makeInvoice(o){
  const t=calcLines(o.lines);
  return put('invoices',{kind:'fatura',date:dstr(),...o,sub:t.sub,vat:t.vat,total:t.total});
}
function vatReport(){
  const m={};const add=(ym,k,v)=>{(m[ym]=m[ym]||{ym,h:0,i:0})[k]+=v};
  list('invoices').filter(i=>i.kind==='fatura').forEach(i=>add(String(i.date).slice(0,7),i.direction==='satis'?'h':'i',i.vat));
  list('expenses').forEach(e=>{if(e.vat>0)add(String(e.date).slice(0,7),'i',e.vat)});
  let carry=0;
  return Object.keys(m).sort().map(k=>{
    const r=m[k];const net=r2(r.h-(r.i+carry));const o={ym:k,h:r2(r.h),i:r2(r.i),prev:carry,net};
    if(net<0){carry=-net;o.pay=0;o.carry=carry}else{carry=0;o.pay=net;o.carry=0}
    return o;
  });
}
function cashDay(date){
  const nk=x=>x.method==='nakit';
  const tIn=sum(list('payments').filter(p=>p.date===date&&p.direction==='tahsilat'&&nk(p)),p=>p.amount);
  const pOut=sum(list('payments').filter(p=>p.date===date&&p.direction==='odeme'&&nk(p)),p=>p.amount);
  const eOut=sum(list('expenses').filter(e=>e.date===date&&nk(e)),e=>e.amount);
  const prevC=list('closings').filter(c=>c.date<date).sort((a,b)=>a.date.localeCompare(b.date)).pop();
  const prev=prevC?prevC.counted:num(cfg().openingCash);
  return {prev,tIn,out:pOut+eOut,expected:r2(prev+tIn-pOut-eOut)};
}
function aging(p,dir){
  const inv=list('invoices').filter(i=>i.partyId===p.id&&i.direction===dir&&i.kind==='fatura').sort((a,b)=>a.date.localeCompare(b.date));
  let paid=sum(list('payments').filter(x=>x.partyId===p.id&&x.direction===(dir==='satis'?'tahsilat':'odeme')),x=>x.amount);
  const b={cur:0,d30:0,d60:0,d90:0,d90p:0};const t=dstr();
  inv.forEach(i=>{
    let rest=i.total;const use=Math.min(rest,paid);rest=r2(rest-use);paid-=use;
    if(rest<=0)return;
    const late=daysBetween(i.due||i.date,t);
    if(late<=0)b.cur+=rest;else if(late<=30)b.d30+=rest;else if(late<=60)b.d60+=rest;else if(late<=90)b.d90+=rest;else b.d90p+=rest;
  });
  return {inv:inv.length,...b,total:r2(b.cur+b.d30+b.d60+b.d90+b.d90p)};
}
function dueReminders(){
  const t=dstr(),out=[];
  list('devices').forEach(d=>{
    if(d.nextMaint&&d.nextMaint<=addDays(t,30))out.push({d,kind:'bakım',date:d.nextMaint,late:d.nextMaint<t});
    if(d.warrantyEnd&&d.warrantyEnd>=t&&d.warrantyEnd<=addDays(t,60))out.push({d,kind:'garanti bitişi',date:d.warrantyEnd,late:false});
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
const remSent=(did,kind,date)=>list('reminders').find(r=>r.deviceId===did&&r.kind===kind&&r.due===date);

function linesEditor(host,{lines=[],showPrice=true,showVat=true,showExtra=false,priceField='salePrice',onChange=()=>{}}){
  let L=lines.map(x=>({...x}));
  const prods=list('products').sort(byName);
  const pf=()=>typeof priceField==='function'?priceField():priceField;
  function draw(){
    host.innerHTML='<div>'+L.map((l,i)=>'<div class="ln" data-i="'+i+'">'
      +'<select data-k="productId"><option value="">— ürün seç / serbest satır —</option>'+prods.map(p=>'<option value="'+p.id+'" '+(p.id===l.productId?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select>'
      +'<input data-k="name" placeholder="Açıklama" value="'+esc(l.name||'')+'">'
      +'<div class="ln2"><input data-k="qty" type="number" step="any" inputmode="decimal" placeholder="Miktar'+(l.unit?' ('+esc(l.unit)+')':'')+'" value="'+(l.qty??'')+'">'
      +(showPrice?'<input data-k="price" type="number" step="any" inputmode="decimal" placeholder="Birim fiyat" value="'+(l.price??'')+'">':'')
      +(showVat?'<select data-k="vat" style="max-width:90px">'+vatRates().map(r=>'<option value="'+r+'" '+(+r===+(l.vat??cfg().vatDefault)?'selected':'')+'>%'+r+'</option>').join('')+'</select>':'')
      +(showExtra?'<label class="chk sm"><input type="checkbox" data-k="extra" '+(l.extra?'checked':'')+'> ek satış</label>':'')
      +'<button type="button" class="btn sm danger" data-del>✕</button></div></div>').join('')
      +'</div><button type="button" class="btn sm" data-add>+ Satır ekle</button>';
  }
  host.onclick=e=>{
    if(e.target.closest('[data-add]')){L.push({qty:1,vat:cfg().vatDefault});draw();onChange(L);return}
    const d=e.target.closest('[data-del]');if(d){L.splice(+d.closest('.ln').dataset.i,1);draw();onChange(L)}
  };
  const upd=e=>{
    const t=e.target;const k=t.dataset.k;if(!k)return;const ln=t.closest('.ln');if(!ln)return;const l=L[+ln.dataset.i];
    if(k==='extra')l.extra=t.checked;
    else if(k==='productId'){
      l.productId=t.value;const p=S.products[t.value];
      if(p){l.name=p.name;l.unit=p.unit;l.price=p[pf()]||0;l.vat=p.vat??cfg().vatDefault;if(!l.qty)l.qty=1}
      draw();
    }else l[k]=t.value;
    onChange(L);
  };
  host.addEventListener('input',e=>{if(e.target.dataset.k!=='productId')upd(e)});
  host.addEventListener('change',upd);
  if(!L.length)L.push({qty:1,vat:cfg().vatDefault});
  draw();
  return {get:()=>L.filter(l=>(l.name||l.productId)&&num(l.qty)!==0).map(l=>({...l,qty:num(l.qty),price:num(l.price),vat:num(l.vat??cfg().vatDefault)})),raw:()=>L};
}

/* ---------- imza ---------- */
function sigPad(c){
  c.width=600;c.height=240;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,600,240);x.lineWidth=3;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#111';
  let on=false,empty=true;
  const pos=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*240/r.height]};
  c.addEventListener('pointerdown',e=>{on=true;empty=false;c.setPointerCapture(e.pointerId);const [a,b]=pos(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke();e.preventDefault()});
  c.addEventListener('pointermove',e=>{if(!on)return;const [a,b]=pos(e);x.lineTo(a,b);x.stroke();e.preventDefault()});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>c.addEventListener(n,()=>{on=false}));
  return {empty:()=>empty,clear:()=>{x.fillStyle='#fff';x.fillRect(0,0,600,240);empty=true},data:()=>c.toDataURL('image/png')};
}

function invoiceModal(pre={}){
  if(!list('parties').length){toast('Önce bir cari ekleyin');return go('parties')}
  const mode0=(pre.direction||'satis')+'|'+(pre.kind||'fatura');
  const html='<form class="frm"><div class="g2"><label class="fl"><span>Belge türü</span><select name="mode"><option value="satis|fatura">Satış faturası</option><option value="satis|teklif">Teklif</option><option value="alis|fatura">Alış faturası</option></select></label>'
  +'<label class="fl"><span>Cari *</span><select name="partyId" required></select></label></div>'
  +'<div class="g3"><label class="fl"><span>Belge no</span><input name="no"></label><label class="fl"><span>Tarih</span><input type="date" name="date" value="'+(pre.date||dstr())+'"></label><label class="fl"><span>Vade</span><input type="date" name="due" value="'+(pre.due||'')+'"></label></div>'
  +'<h3 style="margin-top:4px">Kalemler</h3><div id="ied"></div><div class="card" id="itot" style="margin-top:8px"></div>'
  +'<label class="chk"><input type="checkbox" name="stock" checked> Ürün satırlarını stoğa işle (satış: çıkış · alış: giriş)</label>'
  +'<label class="fl"><span>Stok deposu</span><select name="whId">'+whOpts().map(([k,l])=>'<option value="'+k+'" '+(k===defaultWh()?'selected':'')+'>'+esc(l)+'</option>').join('')+'</select></label>'
  +'<div class="g2" id="ipaybox"><label class="fl"><span>Şimdi tahsil edilen / ödenen (₺)</span><input type="number" step="any" name="payAmt" inputmode="decimal"></label><label class="fl"><span>Yöntem</span><select name="payMethod"><option value="nakit">Nakit</option><option value="pos">POS / Kart</option><option value="havale">Havale / EFT</option></select></label></div>'
  +'<label class="fl"><span>Not</span><textarea name="note" rows="2">'+esc(pre.note||'')+'</textarea></label><div class="btns"><button class="btn pri" type="submit">Kaydet</button></div></form>';
  const el=openModal('Fatura / Teklif',html);const f=$('form',el);
  f.elements.mode.value=mode0;
  const mode=()=>f.elements.mode.value.split('|');
  const ed=linesEditor($('#ied',el),{lines:pre.lines||[],priceField:()=>mode()[0]==='alis'?'buyPrice':'salePrice',onChange:tot});
  function tot(){const t=calcLines(ed.raw());$('#itot',el).innerHTML='<div class="row sp"><span>Ara toplam</span><b>'+money(t.sub)+'</b></div><div class="row sp"><span>KDV</span><b>'+money(t.vat)+'</b></div><div class="row sp"><span>Genel toplam</span><b>'+money(t.total)+'</b></div>'}
  function fillParty(){
    const [dir,kind]=mode();const sel=f.elements.partyId,keep=sel.value||pre.partyId||'';
    sel.innerHTML=partyOpts(dir==='alis'?['tedarikci']:['musteri']).map(([k,l])=>'<option value="'+k+'">'+esc(l)+'</option>').join('');sel.value=keep;
    if(!f.elements.no.value||f.elements.no.dataset.auto==='1'){f.elements.no.value=dir==='alis'?'':nextInvNo(kind);f.elements.no.dataset.auto='1'}
    $('#ipaybox',el).style.display=kind==='teklif'?'none':'';
  }
  f.elements.no.oninput=()=>{f.elements.no.dataset.auto='0'};
  f.elements.mode.onchange=()=>{fillParty()};
  f.elements.partyId.onchange=()=>{const p=P(f.elements.partyId.value);if(p&&!f.elements.due.value&&p.termDays)f.elements.due.value=addDays(f.elements.date.value,p.termDays)};
  fillParty();if(pre.no){f.elements.no.value=pre.no;f.elements.no.dataset.auto='0'}tot();
  f.onsubmit=e=>{
    e.preventDefault();if(!f.reportValidity())return;
    const lines=ed.get();if(!lines.length){toast('En az bir kalem girin');return}
    const [dir,kind]=mode();if(dir==='alis'&&!f.elements.no.value){toast('Alış faturası için belge no girin');return}
    const inv=makeInvoice({direction:dir,kind,partyId:f.elements.partyId.value,no:f.elements.no.value,date:f.elements.date.value,due:f.elements.due.value,lines,note:f.elements.note.value,whId:f.elements.whId.value,stockHandled:f.elements.stock.checked&&kind==='fatura',surveyId:pre.surveyId||''});
    if(f.elements.stock.checked&&kind==='fatura')lines.filter(l=>l.productId).forEach(l=>addStock(l.productId,f.elements.whId.value,dir==='satis'?-l.qty:l.qty,dir==='satis'?'satis':'alis',inv.id));
    const pay=num(f.elements.payAmt.value);
    if(pay>0&&kind==='fatura')put('payments',{direction:dir==='satis'?'tahsilat':'odeme',partyId:inv.partyId,invoiceId:inv.id,method:f.elements.payMethod.value,amount:pay,date:inv.date,by:cfg().currentStaffId});
    if(pre.replaceId)remove('invoices',pre.replaceId);
    if(pre.surveyId&&S.surveys[pre.surveyId])put('surveys',{...S.surveys[pre.surveyId],status:'teklif',invoiceId:inv.id});
    el.close();toast('Kaydedildi');ui.invTab=kind==='teklif'?'teklif':dir;if(route.v==='invoices'||route.v==='panel'||route.v==='party'||route.v==='surveys')render();else go('invoices');
  };
}

ACT.scan=async()=>{
  const el=openModal('QR kod tara','<video id="qv" playsinline muted style="width:100%;border-radius:12px;background:#000;max-height:260px"></video><p class="mut sm" id="qmsg">Kamera açılıyor…</p><div class="row"><input id="qman" placeholder="Kodu elle girin (ör. CK-AB12CD)" style="flex:1"><button class="btn pri" id="qgo" type="button">Ara</button></div>');
  let stream=null,stop=false;const orig=el.close;
  el.close=()=>{stop=true;if(stream)stream.getTracks().forEach(t=>t.stop());orig()};
  const found=code=>{
    const c=String(code||'').trim().toUpperCase();const d=list('devices').find(x=>String(x.qrCode).toUpperCase()===c);
    if(d){el.close();ACT.devView(d.id)}else{$('#qmsg',el).textContent='Bu kodla cihaz bulunamadı: '+c}
  };
  $('#qgo',el).onclick=()=>found($('#qman',el).value);
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('#qmsg',el).textContent='Bu tarayıcı kamera ile QR okumayı desteklemiyor. Kodu elle girin.';return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('#qv',el);v.srcObject=stream;await v.play();$('#qmsg',el).textContent='QR kodu kameraya gösterin…';

const PIPE_MAP={9000:['1/4','3/8'],12000:['1/4','3/8'],18000:['1/4','1/2'],24000:['3/8','5/8'],30000:['3/8','5/8'],36000:['3/8','5/8']};
const ceilHalf=n=>Math.ceil(n*2)/2;
function calcMaterials({btu,pipe,drain,cable,kanal,fire}){
  const k=1+num(fire)/100,[liq,gas]=PIPE_MAP[btu]||PIPE_MAP[12000],L=ceilHalf(pipe*k);
  const out=[{key:'pipe_'+liq,name:'Bakır boru '+liq+'"',qty:L,unit:'m'},{key:'pipe_'+gas,name:'Bakır boru '+gas+'"',qty:L,unit:'m'},{key:'insul',name:'Boru izolasyonu',qty:L*2,unit:'m'}];
  if(drain>0)out.push({key:'drain',name:'Drenaj hortumu',qty:ceilHalf(drain*k),unit:'m'});
  if(cable>0)out.push({key:'cable',name:'Sinyal / enerji kablosu',qty:ceilHalf(cable*k),unit:'m'});
  if(kanal>0)out.push({key:'kanal',name:'Plastik kanal',qty:ceilHalf(kanal),unit:'m'});
  out.push({key:'konsol',name:'Dış ünite konsol takımı',qty:1,unit:'adet'});
  if(pipe>5)out.push({key:'gas',name:'Ek soğutucu gaz (tahmini)',qty:Math.round((pipe-5)*num(cfg().gasPerM)),unit:'gr'});
  return out;
}

function resizeImg(file,max=1024){
  return new Promise(res=>{
    const img=new Image();const u=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b),'image/jpeg',.82)};
    img.onerror=()=>res(null);img.src=u;
  });
}

ACT.newMeasure=()=>{
  const html='<form class="frm">'
  +'<label class="fl"><span>Ölçüm etiketi</span><input name="label" placeholder="Örn: İç ünite - dış ünite boru yolu"></label>'
  +'<label class="fl"><span>Birim</span><select name="unit"><option value="m">metre (m)</option><option value="cm">santimetre (cm)</option><option value="mm">milimetre (mm)</option></select></label>'
  +'<label class="fl"><span>Ölçülen değer</span><input name="value" type="number" step="any" inputmode="decimal"></label>'
  +'<label class="fl"><span>Açıklama / not</span><textarea name="note" rows="2"></textarea></label>'
  +'<div class="card"><b>📷 Canlı AR ölçüm (ARKit/ARCore – WebXR)</b>'
  +'<p class="mut sm">Gerçek cihaz ARCore/ARKit desteklemiyorsa bu modül “manuel ölçüm” olarak çalışır. Destekli cihazda dokunduğunuz yüzeye ölçüm noktası koyar ve iki nokta arası gerçek mesafeyi metre cinsinden ölçer.</p>'
  +'<div id="arcam"></div><div id="arres" class="sm"></div></div>'
  +'<div class="btns"><button class="btn pri" type="submit">Kaydet</button></div></form>';
  const el=openModal('Yeni AI ölçüm',html);const f=$('form',el);
  const camBox=$('#arcam',el),resBox=$('#arres',el);
  let session=null,stream=null,raf=null,refSpace=null,viewerSpace=null,hitSrc=null;
  let p1=null,p2=null,drawing=false;
  const supported=()=>navigator.xr&&navigator.xr.requestSession;
  camBox.innerHTML='<button type="button" class="btn" id="arstart">📷 AR ölçümü başlat</button>';
  const cleanup=()=>{
    if(raf)cancelAnimationFrame(raf);raf=null;
    if(hitSrc&&session){try{session.cancelAnimationFrame(hitSrc)}catch(e){}hitSrc=null}
    if(session){try{session.end()}catch(e){}}session=null;
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  };
  el.addEventListener('close',cleanup);
  $('#arstart',el).onclick=async()=>{
    if(!supported()){resBox.innerHTML='<span class="badge warn">Bu tarayıcı WebXR desteklemiyor. Değeri elle girin.</span>';return}
    let ok=false;try{ok=await navigator.xr.isSessionSupported('immersive-ar')}catch(e){ok=false}
    if(!ok){resBox.innerHTML='<span class="badge warn">Bu cihaz ARCore/ARKit ölçümü desteklemiyor. Değeri elle girin.</span>';return}
    try{
      session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test','local-floor'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});
      camBox.innerHTML='<video id="arv" autoplay playsinline muted style="width:100%;border-radius:10px"></video><p class="mut sm">Cihazı yüzeye doğrultun · ilk nokta için dokunun</p>';
      const v=$('#arv',el);if(v){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream}
      refSpace=await session.requestReferenceSpace('local-floor');
      viewerSpace=await session.requestReferenceSpace('viewer');
      hitSrc=await session.requestHitTestSource({space:viewerSpace});
      // RAF döngüsü: her karede hit-test sonucu ile gerçek dünya konumlarını saklıyoruz
      const onFrame=(t,frame)=>{
        raf=session.requestAnimationFrame(onFrame);
        if(!hitSrc)return;
        const hits=frame.getHitTestResults(hitSrc);
        if(!hits.length)return;
        const pose=hits[0].getPose(refSpace);
        if(!pose)return;
        window.__lastHit={x:pose.transform.position.x,y:pose.transform.position.y,z:pose.transform.position.z};
      };
      raf=session.requestAnimationFrame(onFrame);
      // dokunma: gerçek hit konumunu kullan
      const overlay=document.createElement('div');overlay.style.cssText='position:fixed;inset:0;z-index:300;background:transparent;touch-action:none';document.body.appendChild(overlay);
      overlay.addEventListener('pointerdown',e=>{
        const hit=window.__lastHit;if(!hit){resBox.innerHTML='<span class="badge warn">Yüzeye odaklanın, sonra dokunun.</span>';return}
        if(!p1){p1={...hit};resBox.innerHTML='<span class="badge">İlk nokta: '+qf(p1.x)+','+qf(p1.y)+','+qf(p1.z)+' · ikinci nokta için dokunun</span>';return}
        p2={...hit};
        const d=Math.hypot(p2.x-p1.x,p2.y-p1.y,p2.z-p1.z); // gerçek dünya mesafesi, metre
        const unit=f.elements.unit.value;
        const scale=unit==='m'?1:unit==='cm'?100:unit==='mm'?1000:1;
        const val=r2(d*scale);
        f.elements.value.value=val;
        resBox.innerHTML='<span class="badge ok">Ölçüm: '+qf(val)+' '+unit+' (güven yüksek)</span>';
        overlay.remove();cleanup();
      });
      session.addEventListener('end',()=>{overlay&&overlay.remove();cleanup()});
    }catch(e){resBox.innerHTML='<span class="badge bad">AR oturum açılamadı: '+esc(e.message||e)+'.</span>'}
  };
  f.onsubmit=e=>{
    e.preventDefault();if(!f.reportValidity())return;
    const val=num(f.elements.value.value);
    if(val<=0){toast('Ölçüm değeri girin');return}
    const o=put('measurements',{label:f.elements.label.value,unit:f.elements.unit.value,value:val,note:f.elements.note.value,date:dstr(),confidence:0.9,by:cfg().currentStaffId});
    el.close();cleanup();render();toast('Ölçüm kaydedildi');
  };
};

  if(!S.warehouses.wh_merkez)put('warehouses',{id:'wh_merkez',name:'Merkez Depo',kind:'merkez'});
  applyTheme();
  if(cfg().pin)await lockScreen();
  render();renderStatus();flush();
  window.addEventListener('pagehide',flush);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
  initCloud();
})();
</script>
